<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bpmn-js renderer</title>
<!-- bpmn-js modeler — permite createDiagram + importXML com auto-layout -->
<script src="https://unpkg.com/bpmn-js@17/dist/bpmn-modeler.development.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; }
  #canvas { min-width: 100vw; min-height: 100vh; }

  .djs-element[data-element-id] .djs-visual > :first-child { stroke: #2E86AB !important; }
  .djs-element[data-element-id] .djs-visual text {
    fill: #1a1a1a !important;
    font-family: 'Segoe UI', sans-serif !important;
    font-size: 11px !important;
  }
  .bpmn-icon-start-event-none { color: #5CB85C !important; }
  .bpmn-icon-end-event-none { color: #D9534F !important; }
  .bpmn-icon-gateway-none, .bpmn-icon-gateway-xor { color: #F0AD4E !important; }
</style>
</head>
<body>
<div id="canvas"></div>
<script>
  let modeler = null;

  async function renderBpmn(xml) {
    // Estratégia: se o XML tem collaboration, extrai os processos e renderiza
    // cada um separadamente (o collaboration sem BPMNDiagram não renderiza).
    let xmlToUse = xml;

    const hasCollab = /<bpmn:collaboration/i.test(xml);
    const hasDI = /<bpmndi:BPMNDiagram/i.test(xml);

    if (hasCollab && !hasDI) {
      // Extrai os processos e reconstrói um definitions sem collaboration
      const procMatches = xml.match(/<bpmn:process[\s\S]*?<\/bpmn:process>/gi) || [];
      const defHeader = xml.match(/<bpmn:definitions[^>]*>/i);
      if (procMatches.length > 0 && defHeader) {
        // Preserva namespaces do definitions original
        const nsAttrs = defHeader[0].replace('<bpmn:definitions', '').replace('>', '');
        // Reconstrói com todos os namespaces necessários
        xmlToUse = '<?xml version="1.0" encoding="UTF-8"?>\n<bpmn:definitions' + nsAttrs + '>\n'
          + procMatches.join('\n')
          + '\n</bpmn:definitions>';
      }
    }

    if (modeler) {
      modeler.destroy();
      document.getElementById('canvas').innerHTML = '';
    }

    const BpmnJS = window.BpmnJS;
    modeler = new BpmnJS({ container: '#canvas' });

    try {
      // createDiagram + importXML = o modeler gera DI automaticamente
      await modeler.createDiagram();
      const { warnings } = await modeler.importXML(xmlToUse);

      const canvas = modeler.get('canvas');
      canvas.zoom('fit-viewport', 'auto');

      document.title = warnings.length
        ? 'WARN:' + warnings.map(w => typeof w === 'string' ? w : (w.message || 'unknown')).join('; ')
        : 'OK';
    } catch (err) {
      document.title = 'ERROR:' + (err.message || String(err));
      document.getElementById('canvas').innerHTML =
        '<div style="padding:2rem;color:#D9534F;font-family:sans-serif">' +
        '<h2>Erro ao renderizar BPMN</h2>' +
        '<pre>' + (err.message || String(err)) + '</pre>' +
        '</div>';
    }
  }

  window.renderBpmn = renderBpmn;
</script>
</body>
</html>
